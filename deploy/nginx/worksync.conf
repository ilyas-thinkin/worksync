# WorkSync nginx site — installed as /etc/nginx/sites-available/worksync
#
# __PUBLIC_HOST__ is the DuckDNS name (e.g. worksync-kh.duckdns.org). It resolves to the Pi's LAN
# address and carries a Let's Encrypt certificate, so browsers open it without a "not private"
# warning. The old LAN names (worksync, worksync.local, the Pi's IP) keep the self-signed
# certificate and are moved to the public name by server.js ("Public address with a trusted
# certificate"), which carries the sign-in along. See scripts/duckdns-update.sh.
#
# Install:
#   sed "s/__PUBLIC_HOST__/<name>.duckdns.org/g" deploy/nginx/worksync.conf | sudo tee /etc/nginx/sites-available/worksync
#   sudo nginx -t && sudo systemctl reload nginx

# LAN names that go straight to the public name when typed as plain http://.
map $host $worksync_lan_name {
    default                 0;
    worksync                1;
    worksync.local          1;
    ~^192\.168\.\d+\.\d+$   1;
    ~^10\.\d+\.\d+\.\d+$    1;
}

# Redirect HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # 302, not 301: a permanent redirect to the public name would stay cached in every browser.
    if ($worksync_lan_name) {
        return 302 https://__PUBLIC_HOST__$request_uri;
    }
    return 301 https://$host$request_uri;
}

# HTTPS on the public name — trusted Let's Encrypt certificate, renewed by acme.sh
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __PUBLIC_HOST__;

    ssl_certificate     /home/worksync/worksync/certs/public/fullchain.pem;
    ssl_certificate_key /home/worksync/worksync/certs/public/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Larger buffers for SSE / file uploads
    proxy_buffering          off;
    proxy_read_timeout       3600s;
    proxy_send_timeout       3600s;
    client_max_body_size     50M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# HTTPS on the old LAN names and the Tailscale IP — self-signed certificate
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate     /home/worksync/worksync/certs/worksync.crt;
    ssl_certificate_key /home/worksync/worksync/certs/worksync.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Larger buffers for SSE / file uploads
    proxy_buffering          off;
    proxy_read_timeout       3600s;
    proxy_send_timeout       3600s;
    client_max_body_size     50M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
